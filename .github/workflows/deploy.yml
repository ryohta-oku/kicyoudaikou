name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /var/www/kicyoudaikou

            echo "=== デプロイ開始 ==="

            # 最新コードを取得
            echo ">>> git pull..."
            git pull origin main

            # 依存パッケージをインストール
            echo ">>> npm ci..."
            npm ci --production=false

            # Prisma クライアント生成
            echo ">>> Prisma generate..."
            npx prisma generate

            # Next.js ビルド
            echo ">>> npm run build..."
            npm run build

            # DB マイグレーション
            echo ">>> Prisma migrate..."
            npx prisma migrate deploy

            # PM2 でアプリを再起動
            echo ">>> PM2 restart..."
            pm2 startOrRestart ecosystem.config.cjs --env production

            # NEXTAUTH_SECRET がなければ追加
            if ! grep -q "^NEXTAUTH_SECRET" /var/www/kicyoudaikou/.env; then
              NEW_SECRET=$(openssl rand -base64 32)
              echo "NEXTAUTH_SECRET=\"$NEW_SECRET\"" >> /var/www/kicyoudaikou/.env
              echo ">>> NEXTAUTH_SECRET を追加しました"
            fi

            # APP_URL がなければ追加
            if ! grep -q "^APP_URL" /var/www/kicyoudaikou/.env; then
              echo 'APP_URL="http://162.43.7.199"' >> /var/www/kicyoudaikou/.env
              echo ">>> APP_URL を追加しました"
            fi

            # PM2 再起動
            pm2 startOrRestart ecosystem.config.cjs --env production

            echo "=== デプロイ完了 ==="
