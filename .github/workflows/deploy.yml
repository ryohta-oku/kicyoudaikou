name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /var/www/kicyoudaikou

            echo "=== デプロイ開始 ==="

            # 最新コードを取得
            echo ">>> git pull..."
            git pull origin main

            # 依存パッケージをインストール
            echo ">>> npm ci..."
            npm ci --production=false

            # Prisma クライアント生成
            echo ">>> Prisma generate..."
            npx prisma generate

            # Next.js ビルド
            echo ">>> npm run build..."
            npm run build

            # DB マイグレーション
            echo ">>> Prisma migrate..."
            npx prisma migrate deploy

            # PM2 でアプリを再起動
            echo ">>> PM2 restart..."
            pm2 startOrRestart ecosystem.config.cjs --env production

            echo "=== デプロイ完了 ==="

            # アプリの状態確認
            echo "=== PM2 ステータス ==="
            pm2 status
            echo "=== PM2 ログ（最新50行） ==="
            pm2 logs --nostream --lines 50
            echo "=== .env の項目確認（値は非表示） ==="
            grep -oP '^[A-Z_]+' /var/www/kicyoudaikou/.env
            echo "=== APP_URL の値 ==="
            grep "^APP_URL" /var/www/kicyoudaikou/.env
