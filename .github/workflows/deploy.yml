name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/kicyoudaikou

            echo "=== デプロイ開始 ==="

            # .env に必要な環境変数を追加（ビルド前に実行）
            echo ">>> .env チェック..."

            if ! grep -q "^NEXTAUTH_SECRET" /var/www/kicyoudaikou/.env; then
              NEW_SECRET=$(openssl rand -base64 32)
              echo "NEXTAUTH_SECRET=\"$NEW_SECRET\"" >> /var/www/kicyoudaikou/.env
              echo ">>> NEXTAUTH_SECRET を追加しました"
            fi

            # AUTH_SECRET（NextAuth v5 用） - NEXTAUTH_SECRET と同じ値を使用
            if ! grep -q "^AUTH_SECRET" /var/www/kicyoudaikou/.env; then
              AUTH_VAL=$(grep "^NEXTAUTH_SECRET" /var/www/kicyoudaikou/.env | cut -d'=' -f2-)
              echo "AUTH_SECRET=$AUTH_VAL" >> /var/www/kicyoudaikou/.env
              echo ">>> AUTH_SECRET を追加しました"
            fi

            # AUTH_URL（NextAuth v5 用）
            if ! grep -q "^AUTH_URL" /var/www/kicyoudaikou/.env; then
              echo 'AUTH_URL="http://162.43.7.199"' >> /var/www/kicyoudaikou/.env
              echo ">>> AUTH_URL を追加しました"
            fi

            if ! grep -q "^APP_URL" /var/www/kicyoudaikou/.env; then
              echo 'APP_URL="http://162.43.7.199"' >> /var/www/kicyoudaikou/.env
              echo ">>> APP_URL を追加しました"
            fi

            if ! grep -q "^RESEND_API_KEY" /var/www/kicyoudaikou/.env; then
              echo 'RESEND_API_KEY="re_8XQPe29r_4nnm7BiVDa3UvFjHV8u9CQdj"' >> /var/www/kicyoudaikou/.env
              echo ">>> RESEND_API_KEY を追加しました"
            fi

            if ! grep -q "^RESEND_FROM" /var/www/kicyoudaikou/.env; then
              echo 'RESEND_FROM="記帳代行ツール <noreply@coco-star.jp>"' >> /var/www/kicyoudaikou/.env
              echo ">>> RESEND_FROM を追加しました"
            fi

            echo ">>> .env キー一覧:"
            grep -E "^[A-Z_]+=" /var/www/kicyoudaikou/.env | sed 's/=.*/=***/'

            # 最新コードを取得
            echo ">>> git pull..."
            git pull origin main

            # 依存パッケージをインストール
            echo ">>> npm ci..."
            npm ci --production=false

            # Prisma クライアント生成
            echo ">>> Prisma generate..."
            npx prisma generate

            # Next.js ビルド
            echo ">>> npm run build..."
            npm run build

            # ビルド確認
            if [ ! -d ".next" ]; then
              echo "エラー: .next ディレクトリが見つかりません。ビルドが失敗しています。"
              exit 1
            fi
            echo ">>> ビルド成功（.next ディレクトリ確認OK）"

            # DB マイグレーション
            echo ">>> Prisma migrate..."
            npx prisma migrate deploy

            # 初期管理者ユーザーの確認（ユーザーが0人なら初期セットアップ画面で登録可能）
            echo ">>> ユーザーチェック..."
            npx tsx prisma/seed-admin.ts || echo ">>> シードスクリプトスキップ（初期セットアップ画面で登録可能）"

            # PM2 でアプリを再起動
            echo ">>> PM2 restart..."
            pm2 startOrRestart ecosystem.config.cjs --env production

            # 起動確認
            sleep 5
            echo ">>> PM2 status:"
            pm2 status
            echo ">>> PM2 logs (最新20行):"
            pm2 logs --nostream --lines 20

            echo "=== デプロイ完了 ==="
