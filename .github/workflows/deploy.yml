name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /var/www/kicyoudaikou

            echo "=== デプロイ開始 ==="

            # .env にResend設定を追加（なければ）
            ENV_FILE="/var/www/kicyoudaikou/.env"
            if ! grep -q "^RESEND_API_KEY" "$ENV_FILE"; then
              echo '' >> "$ENV_FILE"
              echo '# Resend（メール認証用）' >> "$ENV_FILE"
              echo 'RESEND_API_KEY="re_8XQPe29r_4nnm7BiVDa3UvFjHV8u9CQdj"' >> "$ENV_FILE"
              echo 'RESEND_FROM="記帳代行ツール <noreply@coco-star.jp>"' >> "$ENV_FILE"
              echo ">>> RESEND設定を追加しました"
            fi
            # NEXTAUTH_SECRETが仮の値なら本番用に更新
            if grep -q 'dev-secret-change-in-production' "$ENV_FILE"; then
              NEW_SECRET=$(openssl rand -base64 32)
              sed -i "s|dev-secret-change-in-production|$NEW_SECRET|" "$ENV_FILE"
              echo ">>> NEXTAUTH_SECRETを本番用に更新しました"
            fi

            # 最新コードを取得
            echo ">>> git pull..."
            git pull origin main

            # 依存パッケージをインストール
            echo ">>> npm ci..."
            npm ci --production=false

            # Prisma クライアント生成
            echo ">>> Prisma generate..."
            npx prisma generate

            # Next.js ビルド
            echo ">>> npm run build..."
            npm run build

            # DB マイグレーション
            echo ">>> Prisma migrate..."
            npx prisma migrate deploy

            # PM2 でアプリを再起動
            echo ">>> PM2 restart..."
            pm2 startOrRestart ecosystem.config.cjs --env production

            echo "=== デプロイ完了 ==="
