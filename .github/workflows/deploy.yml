name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    uses: ryohta-oku/deploy-workflows/.github/workflows/nextjs-deploy.yml@main
    with:
      app_name: kicyoudaikou
      port: 3000
      health_check_path: "/login"
      migrate_timing: after_build
      ci_run_migrate: false
      ci_database_url: "file:./dev.db"
      seed_command: "npx tsx prisma/seed-admin.ts 2>/dev/null || echo '>>> シードスクリプトスキップ'"
      env_setup_script: |
        if ! grep -q "^NEXTAUTH_SECRET" /var/www/kicyoudaikou/.env; then
          NEW_SECRET=$(openssl rand -base64 32)
          echo "NEXTAUTH_SECRET=\"$NEW_SECRET\"" >> /var/www/kicyoudaikou/.env
          echo ">>> NEXTAUTH_SECRET を追加しました"
        fi

        if ! grep -q "^AUTH_SECRET" /var/www/kicyoudaikou/.env; then
          AUTH_VAL=$(grep "^NEXTAUTH_SECRET" /var/www/kicyoudaikou/.env | cut -d'=' -f2-)
          echo "AUTH_SECRET=$AUTH_VAL" >> /var/www/kicyoudaikou/.env
          echo ">>> AUTH_SECRET を追加しました"
        fi

        if ! grep -q "^AUTH_URL" /var/www/kicyoudaikou/.env; then
          echo 'AUTH_URL="https://kichou.coco-star.jp"' >> /var/www/kicyoudaikou/.env
          echo ">>> AUTH_URL を追加しました"
        fi

        if ! grep -q "^APP_URL" /var/www/kicyoudaikou/.env; then
          echo 'APP_URL="https://kichou.coco-star.jp"' >> /var/www/kicyoudaikou/.env
          echo ">>> APP_URL を追加しました"
        fi

        if ! grep -q "^RESEND_FROM" /var/www/kicyoudaikou/.env; then
          echo 'RESEND_FROM="記帳代行ツール <noreply@coco-star.jp>"' >> /var/www/kicyoudaikou/.env
          echo ">>> RESEND_FROM を追加しました"
        fi

        # RESEND_API_KEY は秘密情報なのでリポジトリに置かない。
        # VPS の /var/www/kicyoudaikou/.env で直接管理し、ここでは存在チェックのみ行う。
        if ! grep -q "^RESEND_API_KEY" /var/www/kicyoudaikou/.env; then
          echo 'RESEND_API_KEY=""' >> /var/www/kicyoudaikou/.env
          echo ">>> RESEND_API_KEY を追加しました（要設定）"
        fi

        RESEND_VAL=$(grep "^RESEND_API_KEY=" /var/www/kicyoudaikou/.env | sed 's/^[^=]*=//;s/^"//;s/"$//')
        if [ -z "$RESEND_VAL" ]; then
          echo ""
          echo "============================================"
          echo "  [エラー] RESEND_API_KEY が未設定です"
          echo "  VPS の /var/www/kicyoudaikou/.env に値を設定してください"
          echo "============================================"
          exit 1
        fi

        echo ">>> 環境変数チェック OK"
    secrets: inherit
